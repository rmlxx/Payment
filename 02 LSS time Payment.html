<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Lss Time · Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Shippori+Mincho:wght@400;700&family=Trirong:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0508;--bg2:#2b0a11;--vel:#7d1424;--gold:#dcbc70;--gold2:#f7e3b0;--ink:#f4e8de;--mute:#cfb1a4;--line:rgba(220,188,112,.38);--glass:rgba(40,6,14,.5);--hd:rgba(26,5,8,.84);--warn:#ee8a9a;--stage:rgba(30,5,12,.5);--lat:rgba(220,188,112,.07);
--f:"Trirong","Cormorant Garamond",serif;--disp:"Cinzel","Cormorant Garamond",serif;--gl:"Charmonman","Trirong",serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[lang=en]{--f:"Cormorant Garamond","Trirong",serif}
:root[lang=ja]{--f:"Shippori Mincho","Trirong",serif;--gl:"Shippori Mincho",serif}
:root[data-theme=light]{--bg:#f7ede6;--bg2:#fff6ee;--vel:#b33a49;--gold:#8f6a1c;--gold2:#6e4f10;--ink:#3b1c21;--mute:#7d5c5c;--line:rgba(154,116,36,.5);--glass:rgba(255,250,244,.72);--hd:rgba(247,237,230,.88);--warn:#b02a40;--stage:rgba(255,246,238,.55);--lat:rgba(154,116,36,.11)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
html:not(.go){overflow:hidden}
body{margin:0;color:var(--ink);font:400 17px/1.75 var(--f);overflow-x:hidden;min-height:100vh}
:root[lang=en] body{font-size:19px;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
svg.x{width:auto;height:auto;stroke:none;fill:none;vertical-align:baseline}
svg.su{fill:none;stroke:currentColor;stroke-width:1.5}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(60% 45% at 15% 10%,rgba(125,20,36,.7),transparent 70%),
 radial-gradient(55% 40% at 90% 40%,rgba(90,10,24,.65),transparent 70%),
 radial-gradient(70% 50% at 30% 100%,rgba(125,20,36,.55),transparent 70%),var(--bg);background-size:140% 140%;animation:drift 22s ease-in-out infinite alternate}
:root[data-theme=light] #bg{background:
 radial-gradient(60% 45% at 15% 10%,rgba(179,58,73,.25),transparent 70%),
 radial-gradient(55% 40% at 90% 40%,rgba(220,188,112,.3),transparent 70%),
 radial-gradient(70% 50% at 30% 100%,rgba(179,58,73,.18),transparent 70%),var(--bg);background-size:140% 140%}
@keyframes drift{to{background-position:100% 60%}}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* ---------- splash: wax-sealed envelope ---------- */
#sp{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:radial-gradient(70% 55% at 50% 45%,#3a0b16,#1a0508 75%);transition:opacity 1s ease,visibility 1s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.go #sp{opacity:0;visibility:hidden;pointer-events:none}
.env{position:relative;width:min(78vw,320px);aspect-ratio:3/2;perspective:1000px;animation:floaty 4s ease-in-out infinite;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.opening .env{animation:none;transform:translateY(70px) scale(1.04)}
@keyframes floaty{50%{transform:translateY(-8px)}}
.env>*{position:absolute;inset:0}
.env .back{z-index:0;background:linear-gradient(160deg,#5b0f1c,#3a0813);border-radius:8px;box-shadow:0 0 0 1px rgba(220,188,112,.45),0 30px 50px -20px #000}
.env .letter{z-index:2;inset:6% 7% 10%;background:linear-gradient(180deg,#f6e8c6,#e2caa0);border-radius:5px;color:#5b0f1c;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;gap:3px;transition:transform 1.1s .6s cubic-bezier(.3,1.15,.4,1);box-shadow:0 0 0 1px rgba(91,15,28,.25),0 10px 24px -8px rgba(0,0,0,.6)}
.env .letter::before{content:"";position:absolute;inset:5px;border:1px solid rgba(154,116,36,.7);border-radius:3px}
.env .letter small{font:500 10px var(--disp);letter-spacing:.4em}
.env .letter i{display:block;width:40%;height:1px;background:rgba(91,15,28,.4);margin:5px 0}
.env .letter b{font:700 clamp(18px,6vw,24px)/1 "Cinzel Decorative",var(--disp);letter-spacing:.04em}
.opening .env .letter{transform:translateY(-58%)}
.env .pocket{z-index:3;background:linear-gradient(135deg,#751324,#4a0b17);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:8px}
.env .flap{z-index:4;background:linear-gradient(180deg,#9a1d31,#5b0f1c);clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:50% 0;transition:transform .9s cubic-bezier(.6,0,.3,1),z-index 0s .42s}
.opening .env .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute!important;inset:auto!important;left:50%;top:58%;width:62px;height:62px;margin:-31px 0 0 -31px;z-index:5;border-radius:50% 46% 52% 48%/48% 52% 46% 50%;background:radial-gradient(circle at 35% 30%,#f7e3b0,#dcbc70 45%,#9a7424);display:grid;place-items:center;box-shadow:0 6px 14px -4px #000,inset 0 0 0 3px rgba(91,15,28,.25);color:#5b0f1c;font:700 28px/1 "Cinzel Decorative",var(--disp);transition:transform .5s,opacity .5s}
.seal::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(91,15,28,.45)}
.opening .seal{transform:scale(1.3) rotate(20deg);opacity:0}
.sp-t{text-align:center;transition:opacity .6s}
.opening .sp-t{opacity:0}
.sp-t .nm{margin:0;font:700 30px/1.1 "Cinzel Decorative",var(--disp);color:var(--gold2);letter-spacing:.06em}
.sp-t .hn{margin:12px 0 0;font:500 12px var(--disp);letter-spacing:.4em;color:#b79a6a;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px}
.tb b{font:700 16px var(--disp);letter-spacing:.14em;color:var(--gold);display:flex;gap:8px;align-items:center}
.ct2{display:flex;gap:4px;align-items:center}
.ct2 button{min-width:34px;height:32px;padding:0 8px;border-radius:99px;font:500 13px var(--disp);letter-spacing:.06em;color:var(--mute)}
.ct2 button[aria-pressed=true]{color:var(--bg);background:var(--gold)}
.ct2 .ic{font-size:18px;color:var(--ink)}

/* ---------- stage (framed theatre panel) ---------- */
.stage{position:relative;max-width:560px;margin:12px auto 20px;border:1px solid var(--gold);border-radius:6px;overflow:hidden;
 background:linear-gradient(135deg,transparent 49.4%,var(--lat) 50%,transparent 50.6%) 0 0/34px 34px,linear-gradient(45deg,transparent 49.4%,var(--lat) 50%,transparent 50.6%) 0 0/34px 34px,var(--stage)}
.stage::after{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:3px;pointer-events:none;z-index:6}
@media(max-width:600px){.stage{margin-left:10px;margin-right:10px}}
svg.val{height:auto;position:absolute;left:0;top:0;width:100%;z-index:5;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
svg.dr{position:absolute;top:0;width:44px;height:250px;z-index:5;pointer-events:none}
svg.dr.l{left:0}svg.dr.r{right:0;transform:scaleX(-1)}
svg.cr{position:absolute;width:84px;height:84px;z-index:7;pointer-events:none;bottom:0}
svg.cr.bl{left:0;transform:scaleY(-1)}svg.cr.br{right:0;transform:scale(-1,-1)}
.sp4{position:absolute;color:var(--gold2);pointer-events:none;animation:tw 3.4s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.75;transform:scale(1) rotate(45deg)}}
main{position:relative;padding:clamp(72px,17vw,100px) 18px 0;text-align:center}

/* ---------- common ---------- */
.sec{padding-top:54px}
.orn{display:flex;align-items:center;gap:12px;margin:0 auto 14px;max-width:280px;color:var(--gold)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold));transform:scaleX(0);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.orn i+svg+i{background:linear-gradient(270deg,transparent,var(--gold))}
.in .orn i,.orn.in i{transform:scaleX(1)}
.orn svg{width:16px;height:16px;flex:none}
h1,h2{margin:0;color:var(--gold);line-height:1.15;font-weight:700}
.en{display:block;font-family:var(--disp);font-weight:700;letter-spacing:.07em}
.gl{display:block;font:400 17px/1.4 var(--gl);color:var(--mute);margin-top:4px;letter-spacing:.02em}
h2 .en{font-size:clamp(22px,6.6vw,29px)}
h1 .en{font:700 clamp(34px,10.5vw,50px)/1.1 "Cinzel Decorative",var(--disp);letter-spacing:.05em;background:linear-gradient(100deg,#b88a2e 15%,#fff2c0 45%,#dcbc70 60%,#b88a2e 85%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
:root[data-theme=light] h1 .en{background-image:linear-gradient(100deg,#7a561a 15%,#c9a24a 45%,#8f6a1c 60%,#7a561a 85%)}
@keyframes shine{to{background-position:-260% 0}}
.sub{margin:8px auto 0;color:var(--mute);font-size:15.5px;max-width:40ch}
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.hero{padding-top:6px}
.kick{font:500 10.5px var(--disp);letter-spacing:.26em;padding:0 34px;color:var(--gold2);margin-bottom:10px}
.hero .orn{margin-top:14px}

/* ---------- ribbon ---------- */
.rib{display:inline-block;position:relative;padding:3px 30px;font:700 11.5px/1.7 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:#6b1626;background:linear-gradient(180deg,#fbe9dc,#ecc9b7);clip-path:polygon(0 0,100% 0,calc(100% - 11px) 50%,100% 100%,0 100%,11px 50%);white-space:nowrap}
.rib .en,.rib .gl{display:inline;color:#6b1626}
.rib .gl{font-size:13px;letter-spacing:.02em;margin:0 0 0 8px;text-transform:none}
.ribw{filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}

/* ---------- account arch + QR ---------- */
.archw{position:relative;margin-top:30px}
svg.crest{height:auto;position:absolute;left:50%;top:-24px;width:min(64%,230px);transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.ar{position:relative;padding:74px 22px 30px;border:1px solid var(--line);border-radius:220px 220px 18px 18px;background:linear-gradient(180deg,rgba(125,20,36,.55),var(--glass));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
:root[data-theme=light] .ar{background:linear-gradient(180deg,rgba(179,58,73,.16),var(--glass))}
.ar::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:inherit;pointer-events:none}
.qrf{position:relative;width:min(100%,214px);margin:0 auto;padding:9px;background:#000;border:2px solid var(--gold);border-radius:6px;box-shadow:0 0 0 5px rgba(26,5,8,.55),0 0 0 6px var(--gold),0 18px 30px -12px #000}
:root[data-theme=light] .qrf{background:#fff;box-shadow:0 0 0 5px rgba(247,237,230,.8),0 0 0 6px var(--gold),0 18px 30px -12px rgba(59,28,33,.4)}
.qrf img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.qrf .ph{position:absolute;inset:9px;display:grid;place-items:center;text-align:center;color:#7a5640;font-size:13px;padding:16px;background:repeating-linear-gradient(45deg,#fbf3e6,#fbf3e6 10px,#f4e6cf 10px,#f4e6cf 20px)}
.qrf.has .ph{display:none}
.qrr{margin:-6px 0 0;position:relative;z-index:2}
.pf{display:inline-flex;gap:7px;align-items:center;margin-top:14px;padding:4px 2px;font:600 14px var(--disp);letter-spacing:.14em;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--line);transition:color .3s,border-color .3s}
.pf:hover{color:var(--gold2);border-color:var(--gold)}
.pf svg{width:14px;height:14px}
.dl{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:4px}
.dl[hidden]{display:none}
.bank{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:3px 18px;border:1px solid var(--line);border-radius:99px;color:var(--gold)}
.bank .en,.bank .gl{display:inline;margin:0}
.bank .en{font-size:13.5px;letter-spacing:.22em}
.bank .gl{font-size:15px;margin-left:8px}
.dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e3b0,#9a7424);flex:none}
.num{margin:12px 0 0;font:700 clamp(22px,7vw,30px)/1.1 var(--disp);letter-spacing:.08em;color:var(--gold2)}
.who{margin:12px 0 0;font-size:20px;font-weight:500}
.who small{display:block;font:500 12.5px var(--disp);color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.chk{margin:10px auto 0;font-size:14.5px;color:var(--mute);max-width:34ch}
.btn{display:inline-flex;gap:8px;align-items:center;margin-top:18px;padding:9px 24px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);transition:background .35s,color .35s;font-size:16px}
.btn:hover,.btn:active{background:var(--gold);color:var(--bg)}

/* ---------- cards ---------- */
.nt{margin-top:28px;display:grid;gap:18px;text-align:left}
.card{position:relative;padding:20px 20px 18px;border:1px solid var(--line);border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px var(--line)}
.card .h{display:flex;gap:12px;align-items:center;color:var(--gold)}
.card .h>svg{font-size:24px;flex:none}
.card .en{font-size:15.5px;letter-spacing:.08em}
.card p{margin:10px 0 0;font-size:15.5px;line-height:1.75}
.card ul{margin:8px 0 0;padding-left:20px;font-size:15.5px}
.card li{margin:3px 0}
.card.hot{border:1px dashed var(--gold);background:linear-gradient(180deg,rgba(125,20,36,.55),var(--glass));padding-top:28px}
:root[data-theme=light] .card.hot{background:linear-gradient(180deg,rgba(179,58,73,.14),var(--glass))}
.card.hot .h{color:var(--gold2)}
.card.hot>.ribw{position:absolute;left:50%;top:-14px;transform:translateX(-50%)}
.card.warn .h{color:var(--warn)}

/* ---------- steps ---------- */
.st{counter-reset:s;margin:28px 0 0;padding:0;list-style:none;display:grid;gap:14px;text-align:left}
.st li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--glass);box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px var(--line)}
.st li::before{content:counter(s);flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e3b0,#dcbc70 55%,#9a7424);color:#5b0f1c;font:700 16px var(--disp)}
.st .en{font-size:15.5px;color:var(--gold)}
.st .gl{margin:0 0 2px}
.st span.t{font-size:14.5px;color:var(--mute);line-height:1.6;display:block}

/* ---------- contact ---------- */
.cl{margin-top:26px;display:grid;gap:12px}
.cl>*{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 20px;border:1px solid var(--line);border-radius:14px;background:var(--glass);color:var(--ink);text-decoration:none;width:100%;transition:border-color .3s,transform .3s;box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px var(--line)}
.cl>*:hover{border-color:var(--gold);transform:translateY(-2px)}
.cl svg{font-size:22px;color:var(--gold);flex:none}
.cl span{flex:1;min-width:0}
.cl small{display:block;color:var(--mute);line-height:1.3;font:500 11.5px var(--disp);letter-spacing:.22em;text-transform:uppercase}
.cl b{font-weight:600;overflow-wrap:anywhere}
.cl .go2{font-size:16px;opacity:.7}

/* ---------- finale ---------- */
.fin{position:relative;margin-top:70px;padding:30px 10px 120px;text-align:center;overflow:hidden;cursor:pointer}
.fin svg.crest{position:relative;left:auto;top:auto;margin:0 auto;display:block;opacity:0;transform:translateY(14px) scale(.8);width:min(58%,210px)}
.play svg.crest{animation:crest 1.2s .1s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes crest{to{opacity:1;transform:none}}
.ty{margin:14px 0 0;padding:0 .1em;font:700 clamp(28px,8.4vw,52px)/1.15 "Cinzel Decorative",var(--disp);letter-spacing:.02em;white-space:nowrap;perspective:600px}
.ty span{display:inline-block;padding:0 .04em;opacity:0;transform:translateY(55%) scale(.55) rotateX(80deg);filter:blur(8px);color:transparent;background:linear-gradient(100deg,#a67a25 20%,#fff4c8 46%,#dcbc70 56%,#a67a25 80%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text}
:root[data-theme=light] .ty span{background-image:linear-gradient(100deg,#6e4f10 20%,#c9a24a 46%,#8f6a1c 56%,#6e4f10 80%)}
.ty .sp{width:.34em}
.play .ty span{animation:pop 1.1s calc(var(--i)*.075s + .35s) cubic-bezier(.2,1.25,.4,1) forwards,shine 4.2s calc(var(--i)*.075s + 1.8s) linear infinite}
@keyframes pop{55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
.fin .ln{display:flex;align-items:center;gap:12px;max-width:300px;margin:16px auto 0;color:var(--gold)}
.fin .ln i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold));transform:scaleX(0);transform-origin:right;transition:transform 1.4s 1.5s cubic-bezier(.2,.8,.2,1)}
.fin .ln i+svg+i{background:linear-gradient(270deg,transparent,var(--gold));transform-origin:left}
.fin .ln svg{width:18px;height:18px;opacity:0;transform:scale(0) rotate(-90deg);transition:transform .8s 1.4s cubic-bezier(.3,1.5,.5,1),opacity .6s 1.4s}
.play .ln i{transform:scaleX(1)}.play .ln svg{opacity:1;transform:none}
.fin .gl2{margin:12px 0 0;font:400 20px var(--gl);color:var(--gold2);opacity:0;transform:translateY(10px);transition:opacity 1s 1.9s,transform 1s 1.9s}
.play .gl2{opacity:1;transform:none}
.fin .small{margin:26px 0 0;font:500 11px var(--disp);letter-spacing:.3em;color:var(--mute);opacity:0;transition:opacity 1s 2.3s}
.play .small{opacity:.9}
.fl{position:absolute;width:18px;height:18px;color:var(--gold);opacity:0;pointer-events:none}
.play .fl{animation:rise 3.6s var(--d) ease-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.4) rotate(0)}20%{opacity:.95}100%{opacity:0;transform:translateY(-120px) scale(1) rotate(var(--r))}}
.ring{position:absolute;left:50%;top:120px;width:10px;height:10px;margin:-5px;border:1px solid var(--gold);border-radius:50%;opacity:0;pointer-events:none}
.play .ring{animation:ring 2.4s 1.2s ease-out 2}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(40)}}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:150;padding:9px 22px;border-radius:99px;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bs{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden}
.bs{position:absolute;color:var(--gold);will-change:transform,opacity}
.bs svg{width:100%;height:100%}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv,.ty span,.fin svg.crest,.fin .gl2,.fin .small{opacity:1;transform:none;filter:none}.orn i,.fin .ln i{transform:scaleX(1)}.fin .ln svg{opacity:1;transform:none}.ty span{color:var(--gold)}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div><canvas id="dust" aria-hidden="true"></canvas>

<!-- shared decorative symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let L=0;const LN=['th','en','ja'];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const ICON={sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19',moon:'M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z'};
const H=k=>{const e=HEAD[k],g=L===0?e[1]:L===2?e[2]:(e[3]||'');return `<span class="en">${e[0]}</span>${g?`<span class="gl">${g}</span>`:''}`};

function render(){
  document.documentElement.lang=LN[L];
  if(typeof setQR==='function')setQR();
  $$('[data-t]').forEach(e=>e.textContent=TX[e.dataset.t][L]);
  $$('[data-h]').forEach(e=>e.innerHTML=H(e.dataset.h));
  $('#hint').textContent=TX.hint[L];
  $('#slipL').innerHTML=TX.slipL.map(a=>`<li>${a[L]}</li>`).join('');
  $('#stList').innerHTML=TX.st.map((t,i)=>`<li><div>${H('s'+(i+1))}<span class="t">${t[L]}</span></div></li>`).join('');
  const dark=document.documentElement.dataset.theme==='dark';
  $('#cn').innerHTML=['TH','EN','日本'].map((t,i)=>`<button type="button" data-l="${i}" aria-pressed="${i===L}">${t}</button>`).join('')+`<button type="button" class="ic" id="th" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="${dark?ICON.sun:ICON.moon}"/></svg></button>`;
  $$('#cn [data-l]').forEach(b=>b.onclick=()=>{L=+b.dataset.l;sv('lst-l',L);render()});
  $('#th').onclick=()=>{document.documentElement.dataset.theme=dark?'light':'dark';sv('lst-t',dark?'light':'dark');render()};
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}
function copy(txt){
  const done=()=>toast(TX.copied[L]);
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb();
}
$('#cpAcc').onclick=()=>copy(ACC);

function setQR(){const i=$('#qrImg'),src=document.documentElement.dataset.theme==='light'?QR_LIGHT:QR_SRC;i.onload=()=>{i.hidden=false;$('#qrBox').classList.add('has');const d=$('#qrDl');d.href=src;d.hidden=false};i.src=src}

/* theatre valance: swags, pleats, pearls, tassels, hanging strings */
(function(){
  const W=560,n=3,sw=W/n,gold='#dcbc70';let s=`<rect x="0" y="0" width="${W}" height="14" fill="url(#gd)"/><rect x="0" y="12" width="${W}" height="2" fill="#5b0f1c" opacity=".55"/>`;
  const pt=(x0,x1,t)=>{const u=1-t;return[x0*u*u*u+3*x0*u*u*t+3*x1*u*t*t+x1*t*t*t,14+258*t*u]};
  for(let i=0;i<n;i++){const x0=i*sw,x1=x0+sw;
    s+=`<path d="M${x0} 14C${x0} 100 ${x1} 100 ${x1} 14Z" fill="url(#wn)"/>`;
    [.12,.24,.36,.5,.64,.76,.88].forEach((t,k)=>{const[x,y]=pt(x0,x1,t);s+=`<path d="M${x} 14L${x} ${y}" stroke="${k%2?'rgba(255,200,200,.14)':'rgba(0,0,0,.3)'}" stroke-width="2"/>`});
    s+=`<path d="M${x0} 14C${x0} 100 ${x1} 100 ${x1} 14" fill="none" stroke="${gold}" stroke-width="1.2"/><path d="M${x0} 14C${x0} 100 ${x1} 100 ${x1} 14" fill="none" stroke="${gold}" stroke-width="3.4" stroke-dasharray="0 7" stroke-linecap="round"/>`}
  s+=`<path d="M60 56V122M500 70V122" stroke="${gold}" stroke-width="2.6" stroke-dasharray="0 7" stroke-linecap="round"/><use href="#s-star" x="51" y="120" width="18" height="18" style="color:${gold}"/><use href="#s-star" x="491" y="120" width="18" height="18" style="color:${gold}"/>`;
  [sw,2*sw].forEach(x=>s+=`<use href="#s-tassel" x="${x-9}" y="12" width="18" height="48"/>`);
  const v=$('#val');v.setAttribute('viewBox',`0 0 ${W} 140`);v.innerHTML=s;
})();

/* twinkling four-point stars */
(function(){const st=$('#stage');for(let i=0;i<16;i++){const e=document.createElement('i');e.className='sp4';const z=7+Math.random()*10;e.style.cssText=`left:${6+Math.random()*88}%;top:${14+Math.random()*80}%;width:${z}px;height:${z}px;animation-delay:${(Math.random()*4).toFixed(2)}s;animation-duration:${(2.6+Math.random()*2.4).toFixed(2)}s`;e.innerHTML='<svg viewBox="0 0 24 24" style="width:100%;height:100%;stroke:none"><use href="#s-star"/></svg>';st.appendChild(e)}})();

/* finale: letters + floating suits */
(function(){
  const t='Thank you';$('#ty').innerHTML=[...t].map((c,i)=>c===' '?`<span class="sp" style="--i:${i}">&nbsp;</span>`:`<span style="--i:${i}">${c}</span>`).join('');
  const ids=['s-heart','s-spade','s-dia','s-club'];
  $('#fls').innerHTML=Array.from({length:10},(_,i)=>`<svg class="su fl" viewBox="0 0 24 24" style="left:${8+i*9.4}%;top:${46+(i%3)*10}%;--d:${(1.4+i*.42).toFixed(2)}s;--r:${(i%2?1:-1)*(30+i*9)}deg"><use href="#${ids[i%4]}"/></svg>`).join('');
  const fitTy=()=>{const ty=$('#ty'),f=$('#fin'),max=f.clientWidth-30;let fs=Math.min(54,innerWidth*.12);ty.style.fontSize=fs+'px';
    for(let i=0;i<40;i++){const w=[...ty.children].reduce((a,c)=>a+c.offsetWidth,0);if(w<=max||fs<=18)break;fs-=2;ty.style.fontSize=fs+'px'}};
  fitTy();addEventListener('resize',fitTy);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTy);
  const f=$('#fin');f.addEventListener('click',()=>{f.classList.remove('play');void f.offsetWidth;f.classList.add('play')});
})();

/* tap burst: minimal card-suit icons (no emoji) */
(function(){
  const layer=$('#bs'),SU=['s-heart','s-spade','s-dia','s-club'];let bi=0;
  addEventListener('pointerdown',e=>{
    if(reduce)return;const x=e.clientX,y=e.clientY,n=6;
    for(let k=0;k<n;k++){
      const d=document.createElement('div');d.className='bs';const z=13+Math.random()*10;
      d.style.cssText=`left:${x}px;top:${y}px;width:${z}px;height:${z}px`;
      d.innerHTML=`<svg class="su" viewBox="0 0 24 24"><use href="#${SU[(bi++)%4]}"/></svg>`;layer.appendChild(d);
      const a=Math.PI*2*(k/n)+Math.random()*.7,r=34+Math.random()*34,rot=()=>(Math.random()-.5)*160;
      const T=(m,sc,ro,dy)=>`translate(calc(-50% + ${Math.cos(a)*r*m}px),calc(-50% + ${Math.sin(a)*r*m+dy}px)) scale(${sc}) rotate(${ro}deg)`;
      d.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(0deg)',opacity:1},{transform:T(1,1,rot(),-8),opacity:1,offset:.55},{transform:T(1.3,.6,rot(),16),opacity:0}],{duration:850+Math.random()*250,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();
    }
  },{passive:true});
})();

/* splash */
function openEnv(){
  const sp=$('#sp');if(sp.classList.contains('opening'))return;sp.classList.add('opening');
  setTimeout(()=>{document.documentElement.classList.add('go');io();window.scrollTo(0,0)},reduce?50:2400);
}
$('#sp').addEventListener('click',openEnv);
$('#sp').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv()}});

/* reveal on scroll */
function io(){
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.12});
  $$('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%3)*80+'ms';o.observe(e)});
  const f=$('#fin'),o2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){f.classList.add('play');o2.disconnect()}}),{threshold:.55});o2.observe(f);
}

/* gold dust */
(function(){
  const c=$('#dust'),x=c.getContext('2d');let W,H,P=[];
  const rs=()=>{const r=devicePixelRatio||1;W=c.width=innerWidth*r;H=c.height=innerHeight*r;P=Array.from({length:Math.round(innerWidth/16)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.6+.5)*r,v:(Math.random()*.25+.08)*r,a:Math.random()*6.28}))};
  rs();addEventListener('resize',rs);
  if(reduce)return;
  (function f(){x.clearRect(0,0,W,H);const dk=document.documentElement.dataset.theme==='dark';
    P.forEach(p=>{p.y-=p.v;p.a+=.02;p.x+=Math.sin(p.a)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      x.globalAlpha=(.25+.35*Math.sin(p.a*1.3+1))*(dk?1:.7);x.fillStyle=dk?'#dcbc70':'#9a7424';x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});
    requestAnimationFrame(f)})();
})();

/* init */
(function(){
  const l=ld('lst-l');if(l!==null&&LN[+l]!==undefined)L=+l;else{const n=(navigator.language||'th').slice(0,2);L=n==='ja'?2:n==='en'?1:0}
  const t=ld('lst-t');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;
  render();
})();
</script>
